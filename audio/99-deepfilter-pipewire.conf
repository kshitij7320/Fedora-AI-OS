# Local PipeWire Filter-Chain Configuration for Zero-Cloud Offline Noise Suppression
# Uses DeepFilterNet LV2 plugin locally via pipewire-module-filter-chain

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "DeepFilter Offline Noise Cancellation Source"
            media.name       = "DeepFilter Noise Suppression"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = deepfilter
                        plugin = deep_filter_mono
                        label  = deep_filter_mono
                        control = {
                            "Atten Limit (dB)" = 100.0
                        }
                    }
                ]
            }
            audio.position = [ FL ]
            capture.props = {
                node.name = "deepfilter_capture"
                node.passive = true
            }
            playback.props = {
                node.name = "deepfilter_source"
                media.class = "Audio/Source"
            }
        }
    }
]
